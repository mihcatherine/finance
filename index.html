<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#174b2b"><meta name="description" content="Organização Financeira">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><link rel="stylesheet" href="./styles.css">
<title>Organização Financeira</title>
</head>
<body>
<div id="toast"></div>
<section id="auth" class="auth"><div class="auth-card">
<img class="auth-logo" src="./icon-192.png" alt="Espada-de-São-Jorge">
<h1>Organização Financeira</h1><p>Seu dinheiro organizado em um só lugar.</p>
<div class="auth-tabs"><button data-mode="login" class="active">Entrar</button><button data-mode="signup">Criar conta</button></div>
<form id="authForm"><div id="nameWrap" class="hidden"><label>Nome<input id="name" autocomplete="name"></label></div><label>E-mail<input id="email" type="email" required autocomplete="email"></label><label>Senha<input id="password" type="password" required minlength="8" autocomplete="current-password"></label><button class="primary wide">Entrar</button><small id="authMsg"></small></form>
</div></section>
<section id="app" class="hidden">
<header class="top"><div class="brand"><img src="./icon-192.png" alt=""><span>Organização<br>Financeira</span></div><div class="top-actions"><button id="hideBtn">◌</button><button id="themeBtn">○</button></div></header>
<main id="main"></main>
<nav class="bottom"><button data-page="home" class="active">⌂<span>Início</span></button><button data-page="transactions">↕<span>Lançamentos</span></button><button data-page="investments">▥<span>Investimentos</span></button><button data-page="analysis">◔<span>Análises</span></button><button data-page="settings">⚙<span>Configurações</span></button></nav>
</section>
<div id="modal" class="modal hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/appwrite@29.0.0"></script><script src="./app.js"></script>
</body></html>
